# Publishes @kevinschaich/components when its version changes. Bump the version in
# packages/components/package.json to release; Renovate picks it up in every project.
name: Publish components

on:
  push:
    branches: [main]
    paths: [packages/components/**]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/components
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - run: bun install && bun run build
      # Trusted publishing (OIDC) needs npm 11.5.1+.
      - run: npm install -g npm@latest
      # Publishes through npm trusted publishing: npm verifies this workflow's GitHub identity (id-token
      # above), so there's no npm token to store or rotate. Configured on npmjs.com under the package's
      # Settings → Trusted publishing (repo kevinschaich/kevinschaich, workflow components.yml).
      - name: Publish if this version is new
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@kevinschaich/components@$version" version >/dev/null 2>&1; then
            echo "$version is already published"
          else
            npm publish --access public
          fi

# Publishes @kevinschaich/components when its version changes. Bump the version in
# packages/components/package.json to release; Renovate picks it up in every project.
name: Publish components

on:
  push:
    branches: [main]
    paths: [packages/components/**]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/components
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish if this version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN isn't set, so @kevinschaich/components isn't published yet. Add the secret to publish."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          if npm view "@kevinschaich/components@$version" version >/dev/null 2>&1; then
            echo "$version is already published"
          else
            npm publish --provenance --access public
          fi

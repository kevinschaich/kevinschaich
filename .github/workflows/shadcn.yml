# Keeps packages/components on current shadcn: re-adds every component unmodified, refreshes the zinc theme,
# rebuilds, and opens a PR with the diff. Review it where it touches a component Kevin customized on purpose.
name: Update shadcn

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/components
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx shadcn@latest add --all --overwrite --yes
      - run: node scripts/update-theme.mjs
      - run: bun run build && bun run typecheck
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: update-shadcn
          title: Update shadcn components and theme
          commit-message: Update shadcn components and theme
          body: |
            Re-ran `shadcn add --all --overwrite` and refreshed the zinc theme in packages/components.
            Check the diff for components that were customized on purpose before merging, then bump the
            package version to publish.
